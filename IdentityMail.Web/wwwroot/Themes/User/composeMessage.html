    <style>
        /* Neobrutalist specifics */
        body {
            background-color: #f0f0f0;
            color: #000;
            font-family: 'Space Grotesk', sans-serif;
        }

        .brutal-border {
            border: 3px solid #000;
        }

        .brutal-border-b {
            border-bottom: 3px solid #000;
        }

        .brutal-border-r {
            border-right: 3px solid #000;
        }

        .brutal-shadow {
            box-shadow: 6px 6px 0px 0px #000;
            transition: transform 0.1s, box-shadow 0.1s;
        }

            .brutal-shadow:active {
                box-shadow: 2px 2px 0px 0px #000;
                transform: translate(4px, 4px);
            }

        /* Override JSON dark mode classes for Neobrutalism since it's typically light/high contrast */
        .dark \.bg-on-background {
            background-color: #fff;
        }

        .dark \.text-primary-fixed {
            color: #000;
        }

        .dark \.border-outline {
            border-color: #000;
        }
    </style>
    <link data-snapdom="injected-import" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet">

<body class="flex h-screen overflow-hidden bg-white">

<textarea class="flex-1 w-full p-lg font-body-md text-body-md text-black focus:outline-none resize-none bg-white" placeholder="WRITE YOUR MESSAGE HERE..."></textarea>

    <script>
        // Handle Sidebar Navigation Tabs
        const navTabs = document.querySelectorAll('nav .flex-1.flex.flex-col.gap-sm a');
        navTabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                e.preventDefault();
                navTabs.forEach(t => {
                    t.classList.remove('bg-brutal-yellow', 'shadow-[4px_4px_0_0_#000]');
                    t.classList.add('bg-white');
                });
                tab.classList.remove('bg-white');
                tab.classList.add('bg-brutal-yellow', 'shadow-[4px_4px_0_0_#000]');
            });
        });

        // Handle Email Message List Items
        const messageItems = document.querySelectorAll('.w-\[380px\] .flex-col > div[class*="p-md"]');
        messageItems.forEach(item => {
            item.addEventListener('click', () => {
                messageItems.forEach(i => {
                    i.classList.remove('bg-brutal-yellow', 'border-l-black', 'shadow-[8px_8px_0_0_#000]');
                    // Restore original unread/read states based on their initial classes if needed,
                    // but for this interaction, we'll just clear the 'active' visual markers.
                    if (i.classList.contains('border-l-brutal-blue')) {
                        i.classList.add('bg-white');
                    } else if (i.classList.contains('opacity-70')) {
                        i.classList.add('bg-gray-100');
                    }
                });

                item.classList.add('bg-brutal-yellow', 'border-l-black', 'shadow-[8px_8px_0_0_#000]');
                item.classList.remove('bg-white', 'bg-gray-100', 'opacity-70');
            });
        });
    </script>
