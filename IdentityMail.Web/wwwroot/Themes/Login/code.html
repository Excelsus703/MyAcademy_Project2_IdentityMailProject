<body class="min-h-screen flex items-center justify-center p-md bg-surface dark:bg-on-background text-on-surface dark:text-surface-bright selection:bg-neo-yellow selection:text-neo-black">
<main class="w-full max-w-md relative z-10">
<!-- Decorative Neobrutalist Elements -->
<div class="absolute -top-12 -left-12 w-24 h-24 border-4 border-neo-black dark:border-white bg-primary -z-10 shadow-neo mix-blend-multiply dark:mix-blend-screen hidden md:block"></div>
<div class="absolute -bottom-8 -right-8 w-16 h-16 border-4 border-neo-black dark:border-white bg-tertiary-fixed rounded-full -z-10 shadow-neo hidden md:block"></div>
<div class="bg-surface-container-lowest dark:bg-inverse-surface border-4 border-neo-black dark:border-white shadow-neo p-xl">
<header class="text-center mb-xl border-b-4 border-neo-black dark:border-white pb-md">
<div class="flex items-center justify-center gap-sm mb-sm">
<span class="material-symbols-outlined text-[40px] font-black" style="font-variation-settings: 'FILL' 1;">mail</span>
<h2 class="font-h2 text-h2 font-black uppercase tracking-tighter">EmailPro</h2>
</div>
<h1 class="font-h1 text-h1 uppercase text-primary dark:text-primary-fixed-dim">Welcome Back</h1>
</header>
<form action="#" class="flex flex-col gap-lg">
<div class="flex flex-col gap-xs">
<label class="font-label text-label uppercase tracking-widest text-on-surface-variant dark:text-surface-variant" for="email">Email Address</label>
<input class="w-full bg-surface dark:bg-on-background border-4 border-neo-black dark:border-white px-md py-sm font-body-lg text-body-lg text-on-surface dark:text-surface-bright focus:outline-none focus:shadow-neo-focus transition-all rounded-none" id="email" name="email" placeholder="user@domain.com" required="" type="email">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label text-label uppercase tracking-widest text-on-surface-variant dark:text-surface-variant flex justify-between" for="password">
<span class="">Password</span>
<a class="hover:text-primary dark:hover:text-primary-fixed underline decoration-2 underline-offset-2" href="#">Forgot?</a>
</label>
<input class="w-full bg-surface dark:bg-on-background border-4 border-neo-black dark:border-white px-md py-sm font-body-lg text-body-lg text-on-surface dark:text-surface-bright focus:outline-none focus:shadow-neo-focus transition-all rounded-none" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
<button class="w-full mt-sm bg-neo-yellow text-neo-black border-4 border-neo-black px-xl py-md font-h2 text-h2 font-black uppercase tracking-widest shadow-neo hover:shadow-neo-hover active:translate-y-1 active:translate-x-1 active:shadow-none transition-all rounded-none cursor-pointer flex items-center justify-center gap-sm" type="submit">
                    Login
                    <span class="material-symbols-outlined font-black">arrow_forward</span>
</button>
</form>
<footer class="mt-lg pt-md border-t-4 border-neo-black dark:border-white text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant dark:text-surface-variant">
                    NEW TO EMAILPRO? 
                    <a class="font-bold text-on-surface dark:text-surface-bright border-b-2 border-neo-black dark:border-white hover:bg-neo-yellow hover:text-neo-black dark:hover:text-neo-black transition-colors" href="#">CREATE ACCOUNT</a>
</p>
</footer>
</div>
</main>
