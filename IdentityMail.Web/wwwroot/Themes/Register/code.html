<!DOCTYPE html>

<html class="dark" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>EmailPro - Register</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Neobrutalist Grid Pattern */
        .bg-neobrutal-grid {
            background-color: #f2ecf4; /* surface-container */
            background-image: linear-gradient(to right, #1d1b20 2px, transparent 2px), linear-gradient(to bottom, #1d1b20 2px, transparent 2px);
            background-size: 48px 48px;
        }

        /* Hide scrollbar for a cleaner look if content overflows slightly */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#63597c",
                        "on-surface": "#1d1b20",
                        "on-primary-fixed-variant": "#4f378a",
                        "on-tertiary-fixed": "#241a00",
                        "surface-container": "#f2ecf4",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#1f1635",
                        "on-background": "#1d1b20",
                        "on-error": "#ffffff",
                        "surface-variant": "#e6e0e9",
                        "tertiary-fixed": "#ffdf93",
                        "on-surface-variant": "#494551",
                        "tertiary": "#765b00",
                        "secondary-container": "#e1d4fd",
                        "error": "#ba1a1a",
                        "surface-container-low": "#f8f2fa",
                        "primary-fixed-dim": "#cfbcff",
                        "tertiary-container": "#c9a74d",
                        "inverse-primary": "#cfbcff",
                        "surface-container-high": "#ece6ee",
                        "inverse-surface": "#322f35",
                        "on-tertiary-fixed-variant": "#594400",
                        "secondary-fixed": "#e9ddff",
                        "on-primary-container": "#e0d2ff",
                        "primary": "#4f378a",
                        "surface-tint": "#6750a4",
                        "surface-dim": "#ded8e0",
                        "on-secondary-fixed-variant": "#4b4263",
                        "inverse-on-surface": "#f5eff7",
                        "error-container": "#ffdad6",
                        "background": "#fdf7ff",
                        "surface-container-highest": "#e6e0e9",
                        "on-tertiary-container": "#503d00",
                        "primary-container": "#6750a4",
                        "secondary-fixed-dim": "#cdc0e9",
                        "primary-fixed": "#e9ddff",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#fdf7ff",
                        "on-primary-fixed": "#22005d",
                        "tertiary-fixed-dim": "#e7c365",
                        "outline": "#7a7582",
                        "on-secondary": "#ffffff",
                        "surface": "#fdf7ff",
                        "on-error-container": "#93000a",
                        "outline-variant": "#cbc4d2",
                        "on-secondary-container": "#645a7d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "sm": "8px",
                        "gutter": "16px",
                        "base": "4px",
                        "2xl": "48px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "layout-margin": "24px",
                        "xs": "4px"
                    },
                    "fontFamily": {},
                    "fontSize": {
                        "h1": [
                            "32px",
                            {
                                "lineHeight": "1.2",
                                "letterSpacing": "-0.02em",
                                "fontWeight": "700"
                            }
                        ],
                        "body-lg": [
                            "18px",
                            {
                                "lineHeight": "1.6",
                                "fontWeight": "400"
                            }
                        ],
                        "h2": [
                            "24px",
                            {
                                "lineHeight": "1.3",
                                "fontWeight": "600"
                            }
                        ],
                        "label": [
                            "12px",
                            {
                                "lineHeight": "1",
                                "fontWeight": "600"
                            }
                        ],
                        "body-md": [
                            "16px",
                            {
                                "lineHeight": "1.5",
                                "fontWeight": "400"
                            }
                        ],
                        "body-sm": [
                            "14px",
                            {
                                "lineHeight": "1.5",
                                "fontWeight": "400"
                            }
                        ]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-neobrutal-grid min-h-screen w-full flex items-center justify-center p-md sm:p-lg text-on-background">
    <!-- Main Registration Card -->
    <main class="w-full max-w-[500px] bg-surface border-[3px] border-on-background shadow-[8px_8px_0px_0px_#1d1b20] p-lg sm:p-xl flex flex-col gap-lg z-10">
        <!-- Header Section -->
        <header class="flex flex-col gap-sm border-b-[3px] border-on-background pb-md">
            <h1 class="font-h1 text-h1 uppercase font-black tracking-tight flex items-center gap-sm">
                <span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 1;">mail</span>
                EMAILPRO
            </h1>
            <h2 class="font-h2 text-h2 uppercase">HESAP OLUŞTUR</h2>
        </header>
        <!-- Form Section -->
        <form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
            <!-- Name Row -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-md">
                <div class="flex flex-col gap-xs">
                    <label class="font-label text-label uppercase bg-on-background text-on-primary inline-block w-max px-sm py-xs border-2 border-on-background" for="firstName">Ad</label>
                    <input class="bg-surface-variant border-[3px] border-on-background p-md font-body-md text-body-md text-on-background placeholder:text-outline shadow-[2px_2px_0px_0px_#1d1b20] focus:outline-none focus:shadow-[4px_4px_0px_0px_#1d1b20] focus:bg-surface transition-all" id="firstName" name="firstName" placeholder="John" type="text" />
                </div>
                <div class="flex flex-col gap-xs">
                    <label class="font-label text-label uppercase bg-on-background text-on-primary inline-block w-max px-sm py-xs border-2 border-on-background" for="lastName">Soyad</label>
                    <input class="bg-surface-variant border-[3px] border-on-background p-md font-body-md text-body-md text-on-background placeholder:text-outline shadow-[2px_2px_0px_0px_#1d1b20] focus:outline-none focus:shadow-[4px_4px_0px_0px_#1d1b20] focus:bg-surface transition-all" id="lastName" name="lastName" placeholder="Doe" type="text" />
                </div>
            </div>
            <!-- Username -->
            <div class="flex flex-col gap-xs">
                <label class="font-label text-label uppercase bg-primary-fixed text-on-primary-fixed inline-block w-max px-sm py-xs border-2 border-on-background" for="username">Kullanıcı Adı</label>
                <div class="relative flex">
                    <span class="bg-surface-dim border-[3px] border-r-0 border-on-background p-md font-body-md text-body-md flex items-center justify-center font-bold">@</span>
                    <input class="w-full bg-surface-variant border-[3px] border-on-background p-md font-body-md text-body-md text-on-background placeholder:text-outline shadow-[2px_2px_0px_0px_#1d1b20] focus:outline-none focus:shadow-[4px_4px_0px_0px_#1d1b20] focus:bg-surface transition-all" id="username" name="username" placeholder="johndoe99" type="text" />
                </div>
            </div>
            <!-- Email -->
            <div class="flex flex-col gap-xs">
                <label class="font-label text-label uppercase bg-secondary-fixed text-on-secondary-fixed inline-block w-max px-sm py-xs border-2 border-on-background" for="email">Email</label>
                <input class="bg-surface-variant border-[3px] border-on-background p-md font-body-md text-body-md text-on-background placeholder:text-outline shadow-[2px_2px_0px_0px_#1d1b20] focus:outline-none focus:shadow-[4px_4px_0px_0px_#1d1b20] focus:bg-surface transition-all" id="email" name="email" placeholder="john.doe@example.com" type="email" />
            </div>
            <!-- Password -->
            <div class="flex flex-col gap-xs">
                <label class="font-label text-label uppercase bg-error-container text-on-error-container inline-block w-max px-sm py-xs border-2 border-on-background" for="password">Şifre</label>
                <input class="bg-surface-variant border-[3px] border-on-background p-md font-body-md text-body-md text-on-background placeholder:text-outline shadow-[2px_2px_0px_0px_#1d1b20] focus:outline-none focus:shadow-[4px_4px_0px_0px_#1d1b20] focus:bg-surface transition-all font-mono" id="password" name="password" placeholder="••••••••" type="password" />
            </div>
            <!-- Confirm Password -->
            <div class="flex flex-col gap-xs">
                <label class="font-label text-label uppercase bg-error-container text-on-error-container inline-block w-max px-sm py-xs border-2 border-on-background" for="confirmPassword">Şifre Tekrarı</label>
                <input class="bg-surface-variant border-[3px] border-on-background p-md font-body-md text-body-md text-on-background placeholder:text-outline shadow-[2px_2px_0px_0px_#1d1b20] focus:outline-none focus:shadow-[4px_4px_0px_0px_#1d1b20] focus:bg-surface transition-all font-mono" id="confirmPassword" name="confirmPassword" placeholder="••••••••" type="password" />
            </div>
            <!-- Action Area -->
            <div class="mt-sm flex flex-col gap-md">
                <button class="w-full bg-tertiary-fixed text-on-tertiary-fixed font-h2 text-h2 uppercase py-md border-[3px] border-on-background shadow-[6px_6px_0px_0px_#1d1b20] active:translate-x-[6px] active:translate-y-[6px] active:shadow-none transition-all flex items-center justify-center gap-sm" type="submit">
                    Kayıt Ol
                    <span class="material-symbols-outlined" style="font-variation-settings: 'wght' 700;">arrow_forward</span>
                </button>
                <p class="font-body-sm text-body-sm text-center text-on-surface-variant mt-xs">
                    Zaten hesabınız var mı?
                    <a class="font-bold text-on-background underline decoration-2 underline-offset-4 hover:bg-tertiary-fixed hover:text-on-tertiary-fixed transition-colors p-xs border-2 border-transparent hover:border-on-background" href="#">Giriş Yap</a>
                </p>
            </div>
        </form>
    </main>
    <!-- Decorative floating elements (Neobrutalist accents) -->
    <div class="absolute top-10 left-10 w-16 h-16 bg-primary border-[3px] border-on-background shadow-[4px_4px_0px_0px_#1d1b20] rounded-full hidden lg:block animate-pulse"></div>
    <div class="absolute bottom-20 right-20 w-24 h-8 bg-error border-[3px] border-on-background shadow-[4px_4px_0px_0px_#1d1b20] hidden lg:block rotate-12"></div>
</body>
</html>
